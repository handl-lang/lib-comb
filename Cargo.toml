[package]
name = "handl-lib-comb"
version = "0.1.0"
edition = "2024"
description = "Combinator library — pure handl (comb plus combinators)."
license = "MIT"
repository = "https://github.com/handl-lang/lib-comb"
readme = "README.md"
homepage = "https://github.com/handl-lang/lib-comb"

# `comb` is pure handl; `combinators` ops are native `handl_ops::Op` impls.
[dependencies]
handl-lib-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-ops = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[patch."https://github.com/handl-lang/kernel"]
handl-ops = { path = "../kernel/crates/handl-ops" }
handl-lib-ops = { path = "../kernel/crates/ops" }